global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: neurokinetic_engine
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9090"]

  # Compatibility target for deployments exposing the legacy 9102 endpoint.
  - job_name: neurokinetic
    metrics_path: /metrics
    static_configs:
      - targets: ["neurokinetic:9102"]
